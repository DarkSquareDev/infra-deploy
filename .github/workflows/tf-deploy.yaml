name: "Terraform AWS"

on:
  pull_request:
    branches:
      - main
  push:
    paths:
      - 'feat/**'
      - 'fix/**'
      - 'wip/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: IAC - PLAN
    runs-on: ubuntu-latest
    steps:
      - name: Git Clone the Repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.1"
          terraform_wrapper: true

      - name: Debug OIDC Token
        run: |
          echo "Repository: $ github.repository "
          echo "Ref: $ github.ref "
          echo "Event: $ github.event_name "

      - name: Configure AWS Creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::280504581481:role/TerraformDeploy
          aws-region: us-east-1

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Upload Terraform Plan Artifact
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: $ secrets.GITHUB_TOKEN 
          script: |
            const planStatus = "$ steps.plan.outcome " === "success"
              ? "Plan succeeded"
              : "Plan failed";

            const approvalMessage = planStatus === "Plan succeeded"
              ? "\n\n### Changes detected! Please review the plan and approve the apply job in GitHub Actions."
              : "";

            const commentBody = [
              "#### Terraform Format and Style: not checked",
              `#### Terraform Initialization: \`$ steps.init.outcome \``,
              `#### Terraform Validation: \`$ steps.validate.outcome \``,
              "",
              `#### Terraform Plan Status: ${planStatus}`,
              "",
              "Terraform plan was uploaded as an artifact.",
              `[View it in the Actions tab]({{https://github.com/${{}} github.repository }}/actions/runs/$ github.run_id )`,
              approvalMessage,
              "",
              `*Pusher: @$ github.actor , Action: $ github.event_name , Workflow: $ github.workflow *`
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

  apply:
    name: IAC - APPLY
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Git Clone the Repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.1"
          terraform_wrapper: true

      - name: Configure AWS Creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::280504581481:role/TerraformDeploy
          aws-region: us-east-1

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false tfplan
        continue-on-error: true

      - uses: actions/github-script@v7
        with:
          github-token: $ secrets.GITHUB_TOKEN 
          script: |
            const applyOutcome = "$ steps.apply.outcome ";
            const applyOutput = process.env.APPLY || 'No output available';

            const commentBody = [
              `#### Terraform Apply \`${applyOutcome}\``,
              "<details><summary>Show Apply Output</summary>",
              "",
              "```",
              applyOutput,
              "```",
              "</details>",
              "",
              `*Applied by: @$ github.actor *`
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
        env:
          APPLY: "terraform\n$ steps.apply.outputs.stdout "